<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0a1628"/>
  <!-- Stars -->
  <circle cx="10" cy="12" r="1.2" fill="#4fc3f7" opacity="0.9"/>
  <circle cx="54" cy="8" r="0.9" fill="#b39ddb" opacity="0.8"/>
  <circle cx="58" cy="22" r="1.1" fill="#4fc3f7" opacity="0.7"/>
  <circle cx="6" cy="30" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="48" cy="14" r="0.7" fill="#fff" opacity="0.5"/>
  <!-- Sun / object circle -->
  <circle cx="32" cy="22" r="8" fill="none" stroke="#ff8a65" stroke-width="1.5" opacity="0.9"/>
  <circle cx="32" cy="22" r="4" fill="#ff8a65" opacity="0.7"/>
  <!-- Telescope tube -->
  <rect x="20" y="35" width="28" height="7" rx="3" fill="#4fc3f7" opacity="0.85" transform="rotate(-20 34 38)"/>
  <!-- Eyepiece -->
  <rect x="14" y="42" width="8" height="5" rx="2" fill="#b39ddb" opacity="0.9" transform="rotate(-20 18 44)"/>
  <!-- Tripod legs -->
  <line x1="32" y1="46" x2="20" y2="60" stroke="#4fc3f7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="46" x2="32" y2="60" stroke="#4fc3f7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="46" x2="44" y2="60" stroke="#4fc3f7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
